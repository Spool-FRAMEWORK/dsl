watchdog: "http://host.docker.internal:8090"

infrastructure:
  eventBus:
    kind: EVENT_BUS
    type: IN_MEMORY

  inbox:
    kind: INBOX
    type: FILE_SYSTEM
    configuration:
      path: "D:/spool/inbox"

  dataLake:
    kind: DATA_LAKE
    type: FILE_SYSTEM
    configuration:
      path: "D:/spool/datalake"

  quarantineRepository:
    kind: QUARANTINE_REPOSITORY
    type: FILE_SYSTEM
    configuration:
      path: "D:/spool/quarantine"

modules:
  - crawler:
      type: POLL
      id: synthea-crawler
      schedule:
        every: 5s
      source:
        type: HTTP
        configuration:
          sourceId: synthea-api
          url: "http://plytrox.com:8000/events?limit=5"
        normalizer: JSON_ARRAY
        mediaType: JSON
        rootPath: events
      eventMapping:
        namingConvention: SNAKE_CASE

  - ingester:
      id: synthea-ingester
      type: REACTIVE

  - janitor:
      id: synthea-janitor
      schedule:
        every: 1s
      configuration:
        threshold: 10s
        ttl: 100s
        quarantineRetention: 30d