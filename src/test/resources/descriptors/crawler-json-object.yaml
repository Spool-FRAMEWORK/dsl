infrastructure:
  eventBus:
    kind: EVENT_BUS
    type: IN_MEMORY

  inbox:
    kind: INBOX
    type: FILE_SYSTEM
    configuration:
      path: "target/spool-test/inbox"

modules:
  - crawler:
      type: POLL
      id: json-object-crawler
      source:
        type: HTTP
        configuration:
          sourceId: json-object-api
          url: "http://localhost:8000/event"
        normalizer: JSON_OBJECT
        mediaType: JSON
      eventMapping:
        namingConvention: SNAKE_CASE
